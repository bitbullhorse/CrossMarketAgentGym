name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the validated artifacts to PyPI"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install release tools
        run: python -m pip install -c constraints-cpu.txt -e ".[release,rl,llm]"
      - name: Validate version and release assets
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python - <<'PY'
          import os
          from crossmarket_agentgym import __version__
          from crossmarket_agentgym.release.versioning import release_tag
          tag = os.environ["RELEASE_TAG"]
          expected = release_tag(__version__)
          if tag and tag != expected:
              raise SystemExit(f"tag {tag!r} does not match {expected}")
          PY
          cmag release freeze --workspace-root .
          python scripts/verify_docs.py
          cmag release check --workspace-root .
      - name: Set reproducible source epoch
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Double-build reproducibility
        run: python scripts/verify_reproducible_build.py
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*.whl dist/*.tar.gz
      - name: Inspect distribution contents
        run: cmag release verify --dist-dir dist
      - name: Write distribution manifest
        run: cmag release manifest --dist-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/

  publish-pypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/crossmarket-agent-gym
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist
      - name: Keep PyPI directory distribution-only
        run: rm dist/release-manifest.json
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-rc* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag --generate-notes --prerelease
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag --generate-notes
          fi
