name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -c constraints-cpu.txt -e ".[dev,docs,legacy-data,release,service]"
      - name: CLI smoke test
        run: cmag --help
      - name: Frozen contract and documentation checks
        run: |
          cmag release freeze --workspace-root .
          python scripts/verify_docs.py
          python scripts/build_versioned_docs.py --dry-run
      - name: Unit tests
        run: pytest --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
      - name: Static checks
        run: ruff check .
      - name: Type checks
        run: mypy src

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install release tools
        run: python -m pip install -e ".[release]"
      - name: Release readiness
        run: cmag release check --workspace-root .
      - name: Set reproducible source epoch
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Double-build reproducibility
        run: python scripts/verify_reproducible_build.py
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*.whl dist/*.tar.gz
      - name: Inspect distribution contents
        run: cmag release verify --dist-dir dist --version 1.0.0
      - name: Write distribution manifest
        run: cmag release manifest --dist-dir dist
      - name: Install wheel in a clean environment
        run: bash scripts/create_clean_env_test.sh
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build CPU image
        run: docker build --pull --no-cache --tag crossmarket-agent-gym:1.0.0 .
      - name: Container quickstart
        run: |
          docker run --rm \
            --network none \
            --cpus 2 \
            --memory 7g \
            --env CUDA_VISIBLE_DEVICES="" \
            crossmarket-agent-gym:1.0.0 \
            quickstart --smoke-steps 64
