run_id: phase5-provider-fallback
workspace_root: .
output_dir: runs
prompt_version: phase5.v1
max_rounds: 1
verify_replay: false

provider:
  provider: mock
  model: deepseek-v4-pro
  api_key_env: DEEPSEEK_API_KEY
  base_url_env: DEEPSEEK_BASE_URL
  default_base_url: https://api.deepseek.com
  endpoint: /chat/completions
  structured_output_mode: json_object
  generation:
    temperature: 0.0
    max_tokens: 256
    timeout_seconds: 10
    max_retries: 0
    retry_backoff_seconds: 0
    seed: 1024

messages:
  - role: user
    content: Return the structured dataset decision.

tool_names: [inspect_dataset]
tool_policy:
  allowed_permissions: [read]
  allowed_tools: [inspect_dataset]
  max_total_calls: 1
  max_expensive_calls: 0
  max_cumulative_seconds: 10

mock_script:
  - content: deliberately invalid JSON

fallback:
  status: safe_default
  markets: []
  safe_to_continue: false
