run_id: phase5-provider-deepseek
workspace_root: .
output_dir: runs
prompt_version: phase5.v1
max_rounds: 3
verify_replay: true

provider:
  provider: openai_compatible
  model: deepseek-v4-pro
  api_key_env: DEEPSEEK_API_KEY
  base_url_env: DEEPSEEK_BASE_URL
  default_base_url: https://api.deepseek.com
  endpoint: /chat/completions
  structured_output_mode: json_object
  generation:
    temperature: 0.0
    max_tokens: 2048
    timeout_seconds: 120
    max_retries: 2
    retry_backoff_seconds: 0.5
    seed: 1024

messages:
  - role: system
    content: Use only registered tools. Return one JSON object matching the response schema.
  - role: user
    content: Inspect the canonical sample dataset and decide whether research may safely continue.

tool_names: [inspect_dataset]
tool_policy:
  allowed_permissions: [read]
  allowed_tools: [inspect_dataset]
  max_total_calls: 2
  max_expensive_calls: 0
  max_cumulative_seconds: 30

fallback:
  status: safe_default
  markets: []
  safe_to_continue: false
