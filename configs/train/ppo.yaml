dataset_root: data/sample
output_dir: runs
run_name: phase3_ppo_cpu

observation:
  market_window_layout: tensor

environment:
  execution_protocol: close_signal_next_open
  base_currency: USD
  lookback: 1
  initial_cash: 1000000
  allow_short: false
  max_leverage: 1.0
  max_asset_weight: 0.40
  max_market_weight: 0.40
  market_weight_overrides: {}
  cash_floor: 0.05
  max_turnover: 0.50
  transaction_cost_bps: 10
  slippage_bps: 5
  reward: risk_adjusted
  risk_aversion: 0.10
  drawdown_penalty: 0.50
  cvar_alpha: 0.05
  cvar_penalty: 0.50
  lot_sizes: {}
  t_plus_one_markets: [CN]
  max_episode_steps: null
  accounting_tolerance: 1.0e-8

split:
  train_end_execution_index: 2
  validation_end_execution_index: 3
  test_end_execution_index: 4

trainer:
  algorithm: PPO
  policy: shared_mlp
  total_timesteps: 1000
  learning_rate: 0.0003
  gamma: 0.99
  n_steps: 32
  batch_size: 16
  n_epochs: 4
  buffer_size: 10000
  learning_starts: 10
  train_freq: 1
  gradient_steps: 1
  tau: 0.005
  features_dim: 32
  net_arch: [32, 32]
  transformer_model_dim: 32
  transformer_heads: 4
  transformer_layers: 1
  action_noise_std: 0.10
  device: cpu
  seed: 1024
  deterministic_eval: true
  eval_episodes: 1
  verbose: 0

callbacks:
  checkpoint_freq: 250
  validation_freq: 250
  early_stop_patience: 5
  finite_guard: true
  max_drawdown: 0.80
  resource_monitor_freq: 100
  audit_freq: 10
  metrics_freq: 10
