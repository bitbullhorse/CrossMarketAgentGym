dataset_root: data/sample
output_dir: runs
run_name: phase3_sac_cpu
environment:
  lookback: 1
  max_asset_weight: 0.40
  max_market_weight: 0.40
split:
  train_end_execution_index: 2
  validation_end_execution_index: 3
  test_end_execution_index: 4
trainer:
  algorithm: SAC
  policy: mlp
  total_timesteps: 128
  batch_size: 16
  buffer_size: 512
  learning_starts: 16
  features_dim: 32
  net_arch: [32, 32]
  device: cpu
callbacks:
  checkpoint_freq: 64
  validation_freq: 64
  early_stop_patience: 5
  finite_guard: true
  max_drawdown: 0.80
  resource_monitor_freq: 32
  audit_freq: 10
  metrics_freq: 10
