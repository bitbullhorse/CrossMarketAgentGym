study_name: phase9-ppo-pso-ray-gpu
output_dir: runs/tuning
storage_path: runs/tuning/phase9-ppo-pso-ray-gpu.sqlite3
max_trials: 8
batch_size: 4
directions: [maximize]

search_space:
  parameters:
    learning_rate:
      kind: float
      low: 0.0001
      high: 0.001
      log: true
    gamma:
      kind: float
      low: 0.95
      high: 0.999
    n_steps:
      kind: int
      low: 8
      high: 16
      step: 8
    batch_size:
      kind: int
      low: 4
      high: 8
      step: 4
  constraints:
    - batch_size <= n_steps

searcher:
  type: pso
  seed: 1024
  population_size: 4

scheduler:
  type: asha
  grace_period: 16
  max_resource: 64
  reduction_factor: 2

executor:
  type: ray
  address: auto
  num_cpus_per_trial: 2
  num_gpus_per_trial: 1
  shutdown_on_close: false

objective:
  type: ppo_validation
  base_train_config: ../train/ppo_tune_gpu.yaml
  budget_stage: stage_a
  seeds: [1024]
  walk_forward_folds: 1
  total_timesteps: 64
  mode: robust
  include_training_time: true

selection:
  strategy: primary

retrain_locked: true
retrain_seed: 7777
retrain_timesteps: 64
