report_id: phase8-softwarex
title: CrossMarketAgentGym SoftwareX Evidence
workspace_root: .
runs_root: runs
output_dir: reports
partition: validation
max_runs: 500
max_json_bytes: 5000000

include_run_ids:
  - phase3_ppo_cpu
  - phase3_sac_cpu
  - phase3_td3_cpu
  - phase4-ppo-pso-stage-a
  - phase6-single-offline
  - phase6-team-offline
  - phase7-no-llm
  - phase7-full-stack-offline

experiments:
